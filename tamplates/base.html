<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Scheduler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #e4ecf7 100%); min-height: 100vh; }
        .navbar { background: linear-gradient(90deg, #4e54c8, #8f94fb); }
        .navbar-brand { font-weight: 700; font-size: 1.4rem; letter-spacing: 0.5px; }
        .card { border: none; border-radius: 14px; transition: transform 0.15s ease, box-shadow 0.15s ease; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.08) !important; }
        .card.border-danger { border-left: 5px solid #dc3545 !important; }
        .btn { border-radius: 8px; font-weight: 500; }
        .btn-primary { background: linear-gradient(90deg, #4e54c8, #8f94fb); border: none; }
        .btn-primary:hover { background: linear-gradient(90deg, #3f45b0, #7d82e8); }
        .badge { border-radius: 6px; padding: 6px 10px; font-weight: 500; }
        .form-control, .form-select { border-radius: 8px; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/">Task Scheduler</a>
    </div>
</nav>
<div class="container pb-5">
    {% block content %}{% endblock %}
</div>
</body>
</html>
